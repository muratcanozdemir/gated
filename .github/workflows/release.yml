name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            cgo: "0"
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
            cgo: "0"
          - goos: windows
            goarch: amd64
            runs-on: ubuntu-latest
            cgo: "0"
          - goos: darwin
            goarch: amd64
            runs-on: macos-latest
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            cgo: "1"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          out="gated-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w \
            -X main.version=${GITHUB_REF_NAME} \
            -X main.commit=${GITHUB_SHA::7} \
            -X main.buildDate=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -o "${out}" ./cmd/gated
          shasum -a 256 "${out}" > "${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gated-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gated-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package policy bundle
        run: |
          tar -czf "dist/gated-policy-${GITHUB_REF_NAME}.tar.gz" policy/
          cp configs/config.example.yaml dist/config.example.yaml

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
