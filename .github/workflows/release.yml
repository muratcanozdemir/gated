name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.1, published as a pre-release) builds
# gated at that version with GoReleaser (.goreleaser.yaml: platforms, archives,
# SBOMs, checksums) and publishes a GitHub release with, per platform
# (OS_ARCH, e.g. linux_arm64):
#   gated_X.Y.Z_OS_ARCH.tar.gz (.zip on Windows)         binary, LICENSE, README, CHANGELOG,
#                                                        example config, systemd units
#   gated_X.Y.Z_OS_ARCH.cdx.json                         CycloneDX SBOM of the binary
#   gated_X.Y.Z_OS_ARCH.<ext>.provenance.sigstore.json   SLSA build provenance (Sigstore bundle)
#   gated_X.Y.Z_OS_ARCH.<ext>.sbom.sigstore.json         SBOM attestation (Sigstore bundle)
# plus the policy bundle, which ships separately because policies change on
# their own cadence:
#   gated-policy_X.Y.Z.tar.gz                            policy/*.rego (no tests) + data.json
#   gated-policy_X.Y.Z.tar.gz.provenance.sigstore.json   SLSA build provenance
# and SHA256SUMS over the archives, SBOMs and policy bundle.
#
# Each platform is built, archived and attested in its own job: darwin on a
# macOS runner (the FSEvents watcher needs cgo and the macOS SDK), the rest
# on Linux. Its files are handed to the publish job as an artifact of that
# platform alone, deleted once the release is published: the release assets
# are the only download. If the release already exists (e.g. created by
# release-please or in the GitHub UI), the assets are attached to it; existing
# assets are never replaced. Every attestation is verified with
# `gh attestation verify` before publishing.
#
# release-please (.github/workflows/release-please.yml) calls this workflow with
# the tag it has just created, because tags pushed with the workflow token do
# not trigger workflows. Called that way, this file is still the signer
# workflow of the attestations.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag vX.Y.Z to build and release, created by release-please at the calling commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GORELEASER_VERSION: v2.20.3 # keep in sync with ci.yml and the Makefile

jobs:
  # Tests and scans the tagged commit once, and lists the platforms to build
  # from .goreleaser.yaml.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.json }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Shipped binaries are built with the newest patched Go (standard
          # library fixes); go.mod's minimum is what CI tests.
          go-version: stable
          check-latest: true
          # no module/build cache: a release is built from fresh downloads only
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Policy tests
        run: make policy-test

      - name: Vulnerability scan (govulncheck)
        # fails the release on a known vulnerability reachable from the code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - id: targets
        name: Platforms (goos x goarch of the build in .goreleaser.yaml, minus ignore)
        run: |
          json=$(yq -o=json '.builds' .goreleaser.yaml |
                 jq -c 'if length != 1 then error("expected one build") else .[0] end
                        | (.ignore // []) as $ignore
                        | [.goos[] as $os | .goarch[] as $arch | {goos: $os, goarch: $arch}
                           | select(. as $t | $ignore | any(.goos == $t.goos and .goarch == $t.goarch) | not)
                           | .runner = (if .goos == "darwin" then "macos-latest" else "ubuntu-latest" end)]')
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "$json" | jq .

  # One job per platform: build, archive and SBOM with GoReleaser for that
  # target only, then SLSA provenance and SBOM attestations, verified.
  platform:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write     # Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.targets) }}
    name: ${{ matrix.goos }}_${{ matrix.goarch }}
    env:
      # not GOOS/GOARCH: those would retarget every go command GoReleaser runs
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # GoReleaser reads the tag and commit date from git
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install syft (GoReleaser's SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: GoReleaser configuration for this platform only
        # outside the checkout: GoReleaser refuses a dirty working tree
        run: |
          yq '.builds[0].goos = [strenv(TARGET_OS)] | .builds[0].goarch = [strenv(TARGET_ARCH)] | del(.builds[0].ignore)' \
            .goreleaser.yaml > "$RUNNER_TEMP/goreleaser.yaml"

      - name: Build, archive, SBOM
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # publishing happens after attestation, in the publish job
          args: release --clean --skip=publish --config ${{ runner.temp }}/goreleaser.yaml

      - id: files
        name: This platform's archive and SBOM
        run: |
          archive=$(jq -r '[.[] | select(.type == "Archive")] | if length != 1 then error("expected one archive") else .[0].name end' dist/artifacts.json)
          base=${archive%.tar.gz}; base=${base%.zip}
          case "$base" in
            "gated_${TAG#v}_${TARGET_OS}_${TARGET_ARCH}") ;;
            *) echo "::error::unexpected archive $archive for $TARGET_OS/$TARGET_ARCH"; exit 1 ;;
          esac
          test -f "dist/$base.cdx.json"
          { echo "archive=$archive"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

      - name: Check the runner's own binary
        # linux/amd64 on ubuntu-latest, darwin/arm64 on macos-latest
        if: (matrix.goos == 'linux' && matrix.goarch == 'amd64') || (matrix.goos == 'darwin' && matrix.goarch == 'arm64')
        run: |
          bin=$(ls dist/gated_${TARGET_OS}_${TARGET_ARCH}*/gated)
          "$bin" -version
          "$bin" -version | grep -F "gated ${TAG#v} "

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.files.outputs.archive }}

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.files.outputs.archive }}
          sbom-path: dist/${{ steps.files.outputs.base }}.cdx.json

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.files.outputs.archive }}
          BASE: ${{ steps.files.outputs.base }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          out=$RUNNER_TEMP/out; mkdir -p "$out"
          cp "dist/$ARCHIVE" "dist/$BASE.cdx.json" "$out/"
          cp "$PROVENANCE_BUNDLE" "$out/$ARCHIVE.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$out/$ARCHIVE.sbom.sigstore.json"
          # signed by this workflow, from this ref and commit, on a GitHub-hosted
          # runner; checked against the attestations API and the published bundles
          common=(--repo "$GITHUB_REPOSITORY"
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
                  --source-ref "$GITHUB_REF"
                  --source-digest "$GITHUB_SHA"
                  --deny-self-hosted-runners)
          verify() { # predicate type, published bundle
            gh attestation verify "$out/$ARCHIVE" "${common[@]}" --predicate-type "$1"
            gh attestation verify "$out/$ARCHIVE" "${common[@]}" --predicate-type "$1" --bundle "$2"
          }
          verify https://slsa.dev/provenance/v1 "$out/$ARCHIVE.provenance.sigstore.json"
          verify https://cyclonedx.org/bom "$out/$ARCHIVE.sbom.sigstore.json"
          ls -l "$out"

      # This platform's files only, for the publish job; deleted once published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.files.outputs.base }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  # The policy bundle: what `make install-config` would put in /etc/gated/policy.
  policy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - id: bundle
        name: Policy bundle (reproducible)
        run: |
          name="gated-policy_${TAG#v}.tar.gz"
          mkdir -p "$RUNNER_TEMP/out"
          find policy -maxdepth 1 -type f \( -name '*.rego' ! -name '*_test.rego' -o -name 'data.json' \) -print0 | LC_ALL=C sort -z |
            tar --null -T - --mtime="@$(git log -1 --format=%ct)" \
                --owner=0 --group=0 --numeric-owner -cf - | gzip -n > "$RUNNER_TEMP/out/$name"
          tar tzvf "$RUNNER_TEMP/out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/${{ steps.bundle.outputs.name }}

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.bundle.outputs.name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          out=$RUNNER_TEMP/out
          cp "$PROVENANCE_BUNDLE" "$out/$NAME.provenance.sigstore.json"
          common=(--repo "$GITHUB_REPOSITORY"
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
                  --source-ref "$GITHUB_REF"
                  --source-digest "$GITHUB_SHA"
                  --deny-self-hosted-runners
                  --predicate-type https://slsa.dev/provenance/v1)
          gh attestation verify "$out/$NAME" "${common[@]}"
          gh attestation verify "$out/$NAME" "${common[@]}" --bundle "$out/$NAME.provenance.sigstore.json"
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gated-policy
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [platform, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release / upload assets
      actions: write      # delete this run's hand-off artifacts afterwards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gated*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip *.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        # Attaches the assets to an existing release (release-please, GitHub UI),
        # keeping its title and notes, or creates it. Never replaces an asset.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: attaching assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            # notes: the version's CHANGELOG.md section, else generated by GitHub
            awk -v v="${TAG#v}" '/^## / { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md 2>/dev/null > "$RUNNER_TEMP/notes.md" || true
            if [[ -s "$RUNNER_TEMP/notes.md" ]]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${notes[@]}" \
              --title "$TAG" "${prerelease[@]}"
          fi

      - name: Delete hand-off artifacts
        # The per-platform artifacts only carry files from the build jobs to
        # this one; the release assets are the distribution.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("gated")) | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "deleting $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
