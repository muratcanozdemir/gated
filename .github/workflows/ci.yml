name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt
      - name: go mod tidy
        run: go mod tidy -diff

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./...

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1 -coverprofile=coverage.out
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  validate:
    name: validate config + policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Policy compilation runs in-process via the OPA Go SDK — no opa
      # binary needed here.
      - run: make build
      - run: ./gated -config configs/config.ci.yaml -validate

  policy:
    name: policy tests (opa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # opa fmt, opa check --strict, opa test with a coverage gate; runs the
      # OPA version from go.mod, i.e. the one the daemon embeds.
      - run: make policy-test

  # The release configuration is valid, and every platform builds and
  # packages with GoReleaser (nothing published or kept). darwin needs cgo and
  # the macOS SDK for the FSEvents watcher, so it builds on macOS.
  goreleaser:
    name: goreleaser (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: linux+windows
            runs-on: ubuntu-latest
            goos: '["linux","windows"]'
          - family: darwin
            runs-on: macos-latest
            goos: '["darwin"]'
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3 # keep in sync with release.yml and the Makefile
          args: check
      - name: GoReleaser configuration for this runner's platforms
        # outside the checkout: GoReleaser refuses a dirty working tree
        env:
          GOOS_LIST: ${{ matrix.goos }}
        run: yq ".builds[0].goos = env(GOOS_LIST)" .goreleaser.yaml > "$RUNNER_TEMP/goreleaser.yaml"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,sbom --config ${{ runner.temp }}/goreleaser.yaml

  ci:
    name: CI
    if: always()
    needs: [fmt, vet, staticcheck, test, validate, policy, goreleaser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
